# Publishes tagged GitHub releases through npm trusted publishing.
# Configure the package's publisher for this repository and this workflow.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          test "v$pkg" = "$RELEASE_TAG" || { echo "tag $RELEASE_TAG does not match package v$pkg"; exit 1; }

      - run: npm ci

      - name: Install browser test engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run release checks
        run: |
          npm test
          npm run test:browser
          npm run test:package
          npm run test:runtime
          npm run test:packed
          npm run typecheck
          npm run pack:check
          npm run test:size
          npm run test:adapters
          npm audit --audit-level=high

      - name: Fail if this version is already on npm
        run: |
          name="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "$name@$ver is already published"; exit 1
          fi

      - run: npm publish --provenance --access public
